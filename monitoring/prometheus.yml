# Prometheus scrape config for the KernelForge docker-compose monitoring profile.
# Mounted at /etc/prometheus/prometheus.yml by the `prometheus` service.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-scrape
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # KernelForge demo/training container (Streamlit on 8501)
  - job_name: "kernelforge"
    static_configs:
      - targets: ["kernelforge:8501"]

  # OpenEnv HTTP server (FastAPI on 8000)
  - job_name: "openenv-server"
    static_configs:
      - targets: ["openenv-server:8000"]
